# ============================================================
# SAU Vibe — Kubernetes Manifests
# Kullanım: kubectl apply -f k8s/
# ============================================================

# ── Namespace ────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: sau-vibe

---
# ── ConfigMap (ortam değişkenleri) ───────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: sau-config
  namespace: sau-vibe
data:
  POSTGRES_DB:                "sauvibe"
  POSTGRES_USER:              "sauvibe"
  SPRING_DATA_REDIS_HOST:     "redis-service"
  SPRING_DATA_REDIS_PORT:     "6379"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"

---
# ── Secret (hassas değerler) ─────────────────────────────────
# Gerçek kullanımda: kubectl create secret generic sau-secret --from-env-file=.env
apiVersion: v1
kind: Secret
metadata:
  name: sau-secret
  namespace: sau-vibe
type: Opaque
stringData:
  POSTGRES_PASSWORD: "sauvibe123"
  GOOGLE_API_KEY:    "your_google_api_key"

---
# ════════════════════════════════════════════════════════════
# PostgreSQL
# ════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: sau-vibe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: sau-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: sau-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sau-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgres-storage
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "sauvibe"]
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: sau-vibe
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: sau-vibe
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432

---
# ════════════════════════════════════════════════════════════
# Redis
# ════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: sau-vibe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          command: ["redis-server", "--save", "60", "1"]
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: sau-vibe
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379

---
# ════════════════════════════════════════════════════════════
# Spring Boot Backend
# ════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: sau-vibe
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: sau-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-service:5432/sauvibe
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: sau-config
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sau-secret
                  key: POSTGRES_PASSWORD
            - name: SPRING_DATA_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: sau-config
                  key: SPRING_DATA_REDIS_HOST
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: sau-vibe
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080

---
# ════════════════════════════════════════════════════════════
# FastAPI AI Model
# ════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai
  namespace: sau-vibe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai
  template:
    metadata:
      labels:
        app: ai
    spec:
      containers:
        - name: ai
          image: sau-ai:latest
          ports:
            - containerPort: 8000
          env:
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sau-secret
                  key: GOOGLE_API_KEY
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 15
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"

---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: sau-vibe
spec:
  selector:
    app: ai
  ports:
    - port: 8000
      targetPort: 8000
