services:

  # ── PostgreSQL ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: sau_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-sauvibe}
      POSTGRES_USER:     ${POSTGRES_USER:-sauvibe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sauvibe123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sauvibe}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sau_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI AI Model ───────────────────────────────────────────
  ai:
    build:
      context: ./apps/CampusAssistantRag
      dockerfile: Dockerfile
    container_name: sau_ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      GOOGLE_API_KEY:  ${GOOGLE_API_KEY}
      TAVILY_API_KEY:  ${TAVILY_API_KEY}
    volumes:
      - ai_chroma:/app/chroma_db
      - ai_data:/app/data_store
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  # ── Spring Boot Backend ────────────────────────────────────────
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: sau_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL:           jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sauvibe}
      SPRING_DATASOURCE_USERNAME:      ${POSTGRES_USER:-sauvibe}
      SPRING_DATASOURCE_PASSWORD:      ${POSTGRES_PASSWORD:-sauvibe123}
      SPRING_DATA_REDIS_HOST:          redis
      SPRING_DATA_REDIS_PORT:          6379
      SPRING_JPA_HIBERNATE_DDL_AUTO:   update
      OPENWEATHER_API_KEY:             ${OPENWEATHER_API_KEY}
      AGENT_API_URL:                   http://ai:8000
      APP_CORS_ALLOWED_ORIGINS:        ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Next.js Frontend ───────────────────────────────────────────
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL:               ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_WS_URL:                ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080}
        NEXT_PUBLIC_OPENWEATHER_KEY:       ${NEXT_PUBLIC_OPENWEATHER_KEY}
        NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME}
        NEXT_PUBLIC_CLOUDINARY_PRESET:     ${NEXT_PUBLIC_CLOUDINARY_PRESET}
    container_name: sau_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      ADMIN_KEY: ${ADMIN_KEY:-admin}
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  ai_chroma:
  ai_data:
